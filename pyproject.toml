[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "jev-stack"
version = "0.1.0"
description = "Jev-compatible System 1 decision stack using Laya + EmbeddingGemma 2"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "KidIkaros"}]
dependencies = [
    "laya>=0.3.28",
    "torch>=2.1.0",
    "transformers>=4.48.0",
    "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
src = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
